[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-diario"
version = "0.1.0"
description = "Aplicación de escritorio para organizar tareas con auto inicio"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayuda Inicial" }]

[project.scripts]
organizador-diario = "app:main"
